services:
  ollama:                      # runs the LLM + embedding model
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

  qdrant:                      # vector database
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  app:                         # your RAG logic (orchestrator)
    build: ./app
    ports: ["8000:8000"]
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    volumes: [./docs:/data/docs:ro]
    depends_on: [ollama, qdrant]

volumes:
  ollama:
  qdrant: